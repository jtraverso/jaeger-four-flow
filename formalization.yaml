      The same author's Nash-Williams–Tutte tree packing entry; its library `TreePackingLib/`
      (commit 101e488) is included unchanged and gives the two edge-disjoint spanning trees.
  - id: "PALOMAR-2026-10-16-000016 (jtraverso/euler-petersen)"
