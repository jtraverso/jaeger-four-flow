# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Jaeger's 4-flow and 8-flow theorems and Seymour's 6-flow theorem"
  description: >-
    A Lean 4 / Mathlib formalization of Jaeger's 4-flow theorem: every finite 4-edge-connected
    simple graph has a nowhere-zero integer 4-flow, i.e. an antisymmetric function on darts with
    values in {±1, ±2, ±3} that is conserved at every vertex. Also proved: a graph with two
    edge-disjoint spanning trees has its edges covered by two even subgraphs (a nowhere-zero
    ℤ₂ × ℤ₂-flow) and has a nowhere-zero integer 4-flow. Version 2 adds Jaeger's 8-flow theorem:
    every finite bridgeless graph has its edges covered by three even subgraphs and has a
    nowhere-zero integer 8-flow; conversely a graph with a nowhere-zero flow has no bridge. Version
    3 adds Seymour's 6-flow theorem (every finite bridgeless graph has a nowhere-zero integer
    6-flow) and Tutte's theorem relating group and integer flows (for k > 0, every nowhere-zero
    ℤ/k-flow φ lifts to a nowhere-zero integer k-flow ψ with ψ ≡ φ mod k, and conversely an integer
    k-flow reduces to a ℤ/k-flow). Mathlib has no flows.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

